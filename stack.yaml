# lts-23.18 is GHC 9.8.4. With system-ghc, the GHC on PATH must BE 9.8.4:
# stack checks this (skip-ghc-check is deliberately off), so a mismatch fails
# as "compiler version mismatch" instead of a cryptic pruned-boot-package
# build plan. CI pins the same version in .github/workflows/ci.yaml.
resolver: lts-23.18
system-ghc: true
install-ghc: false
pvp-bounds: both
packages:
  - .
ghc-options:
  "$locals": -O0
extra-deps:
  - github: purescript/purescript
    commit: v0.15.16
  - language-javascript-0.7.0.0
  - bower-json-1.1.0.0
  - these-1.2.1
  - aeson-better-errors-0.9.1.3
  - github: purescript/cheapskate
    commit: 633c69024e061ad956f1aecfc137fb99a7a7a20b

flags:
  aeson-pretty:
    lib-only: true
